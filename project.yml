name: Seichou
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 12.0.0
options:
  bundleIdPrefix: jp.hayatosuzuki
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    DEVELOPMENT_TEAM: AJ24KB4M4W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Seichou:
    type: application
    platform: iOS
    sources:
      - path: Seichou
        excludes: ["Configuration.storekit"]
      - path: Seichou/Configuration.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hayatosuzuki.seichousize
        PRODUCT_NAME: Seichou
        INFOPLIST_FILE: Seichou/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-ObjC"]
    dependencies:
      - package: GoogleMobileAds
schemes:
  Seichou:
    build: { targets: { Seichou: all } }
    run:
      config: Debug
      storeKitConfiguration: Seichou/Configuration.storekit
    archive: { config: Release }
